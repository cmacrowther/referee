name: Build and Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whether this version needs a release
        id: check
        shell: bash
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"

          # Skip if the tag already exists on origin (handles workflow_dispatch
          # re-runs and accidental duplicate pushes silently).
          if git ls-remote --tags origin "refs/tags/v${CURRENT}" | grep -q .; then
            echo "Tag v${CURRENT} already exists — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # On a push event also require the version to have actually changed.
          if [ "${{ github.event_name }}" = "push" ]; then
            PREV=$(git show HEAD~1:package.json | node -p \
              "let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(JSON.parse(d).version))" \
              2>/dev/null || echo "")
            if [ "${CURRENT}" = "${PREV}" ]; then
              echo "Version unchanged (${CURRENT}) — skipping release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

  test:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/native -> target
            desktop/native/rife-worker -> target

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential

      - name: Run Rust unit tests
        working-directory: desktop/native
        run: cargo test --features headless --no-default-features

      # Frame scheduling, NUT sniffing, and FFmpeg arguments; the ncnn engine
      # is built by the release build.
      - name: Run rife-worker unit tests
        working-directory: desktop/native/rife-worker
        run: cargo test --no-default-features --locked

  test-ui:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run UI tests
        run: npm test -- --run

  build:
    needs: [check-version, test, test-ui]
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact_glob: |
              desktop/native/target/release/bundle/**/*.exe
          - os: ubuntu-latest
            platform: linux
            artifact_glob: |
              desktop/native/target/release/bundle/**/*.deb
              desktop/native/target/release/bundle/**/*.rpm

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/native -> target
            desktop/native/rife-worker -> target

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            cmake \
            rpm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload ${{ matrix.platform }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  # Headless referee-server for the Linux relay service, installed and updated by
  # packaging/systemd/referee-server-update. Built on the oldest supported
  # Ubuntu so the binary runs on glibc 2.35 and newer (Ubuntu 22.04, Debian 12).
  build-server:
    needs: [check-version, test, test-ui]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Runs scripts/fetch-rife-vendor.js.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/native -> target
            desktop/native/rife-worker -> target

      # tauri-build runs in build.rs, so the WebKitGTK headers are needed even
      # for the headless binary.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            cmake

      - name: Build referee-server
        working-directory: desktop/native
        run: cargo build --features headless --bin referee-server --release

      - name: Build rife-worker
        run: |
          node scripts/fetch-rife-vendor.js
          cd desktop/native/rife-worker
          cargo build --release --locked

      # The asset name carries no version so releases/latest/download/ links
      # stay stable; VERSION inside lets the updater check what it unpacked.
      - name: Package referee-server
        shell: bash
        run: |
          BUNDLE=referee-server-linux-x86_64
          mkdir -p "dist/${BUNDLE}"
          install -m 0755 desktop/native/target/release/referee-server "dist/${BUNDLE}/"
          install -m 0755 desktop/native/rife-worker/target/release/rife-worker "dist/${BUNDLE}/"
          install -m 0755 packaging/systemd/referee-server-update "dist/${BUNDLE}/"
          install -m 0644 \
            packaging/systemd/referee-server.service \
            packaging/systemd/referee-server-update.service \
            packaging/systemd/referee-server-update.timer \
            packaging/systemd/referee-server.env \
            LICENSE \
            "dist/${BUNDLE}/"
          echo "${{ needs.check-version.outputs.version }}" > "dist/${BUNDLE}/VERSION"
          tar -C dist -czf "dist/${BUNDLE}.tar.gz" "${BUNDLE}"

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-server-linux
          path: dist/referee-server-linux-x86_64.tar.gz
          if-no-files-found: error

  publish:
    needs: [check-version, build, build-server]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          TAG="v${VERSION}"

          PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "release_name=REFEREE v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.release_name }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.prerelease != 'true' }}
          files: release-assets/**
